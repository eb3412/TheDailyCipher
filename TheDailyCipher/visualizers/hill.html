<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>Hill Cipher Visualizer</title>
<link
    rel="icon"
    type="image/png"
    href="/assets/favicon.png"
>

<link
    rel="apple-touch-icon"
    href="/assets/apple-touch-icon.png"
>

<meta
    name="theme-color"
    content="#030712"
>
<style>

body {
    background:#030712;
    color:white;

    font-family:system-ui;

    text-align:center;

    padding:30px;
}

.matrix {
    display:inline-grid;

    grid-template-columns:
        repeat(2, 70px);

    gap:5px;

    margin:20px;
}

.cell {
    padding:20px;

    background:#1f2937;

    border-radius:8px;

    font-size:20px;
}

input {
    width:50px;
    padding:10px;
    text-align:center;
}

button {
    padding:12px 20px;

    border:0;
    border-radius:8px;

    background:#6366f1;
    color:white;
}

</style>

</head>

<body>

<h2>Hill Cipher Matrix Visualizer</h2>

<p>
The Hill Cipher uses matrix multiplication
and modular arithmetic.
</p>

<div class="matrix">

    <div class="cell">
        <input id="a" value="3">
    </div>

    <div class="cell">
        <input id="b" value="3">
    </div>

    <div class="cell">
        <input id="c" value="2">
    </div>

    <div class="cell">
        <input id="d" value="5">
    </div>

</div>

<br>

<button onclick="showMatrix()">
Calculate Determinant
</button>

<h2 id="result">---</h2>

<script>

function showMatrix() {

    const a =
        Number(document.getElementById("a").value);

    const b =
        Number(document.getElementById("b").value);

    const c =
        Number(document.getElementById("c").value);

    const d =
        Number(document.getElementById("d").value);

    const determinant =
        a * d - b * c;

    document.getElementById(
        "result"
    ).textContent =
        `Determinant = ${determinant}`;
}

</script>

</body>
</html>
