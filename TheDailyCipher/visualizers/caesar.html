<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>
<link
    rel="icon"
    type="image/png"
    href="/assets/favicon.png"
>

<link
    rel="apple-touch-icon"
    href="/assets/apple-touch-icon.png"
>

<meta
    name="theme-color"
    content="#030712"
>
<title>
Caesar Cipher Visualizer
</title>

<style>

:root {

    --background: #030712;

    --surface: #111827;

    --surface-light: #1f2937;

    --border: #374151;

    --text: #f3f4f6;

    --muted: #9ca3af;

    --primary: #6366f1;

    --primary-light: #818cf8;

    --success: #34d399;
}

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    padding: 25px;

    background: var(--background);

    color: var(--text);

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    text-align: center;
}

h2 {
    margin-top: 0;
}

.description {

    max-width: 600px;

    margin:
        0 auto
        25px;

    color: var(--muted);

    line-height: 1.6;
}

.controls {

    display: grid;

    grid-template-columns:
        1fr 120px;

    gap: 10px;

    max-width: 600px;

    margin: auto;
}

label {

    display: block;

    margin-bottom: 5px;

    color: var(--muted);

    font-size: 12px;

    text-align: left;
}

input {

    width: 100%;

    padding: 12px;

    background: white;

    color: #111827;

    border:
        1px solid
        var(--border);

    border-radius: 9px;

    font-size: 16px;

    text-transform: uppercase;
}

button {

    width: 100%;

    max-width: 600px;

    margin-top: 12px;

    padding: 13px;

    border: 0;

    border-radius: 9px;

    background:
        var(--primary);

    color: white;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;
}

button:hover {

    background:
        var(--primary-light);
}

button:disabled {

    opacity: 0.5;

    cursor: not-allowed;
}

.current-step {

    max-width: 600px;

    min-height: 115px;

    margin:
        25px auto
        15px;

    padding: 20px;

    background:
        var(--surface);

    border:
        1px solid
        var(--border);

    border-radius: 13px;
}

.step-label {

    color: var(--muted);

    font-size: 11px;

    letter-spacing: 2px;

    text-transform: uppercase;
}

.step-main {

    margin-top: 9px;

    font-family: monospace;

    font-size: 30px;

    font-weight: 800;
}

.step-explanation {

    margin-top: 8px;

    color:
        var(--primary-light);

    font-size: 14px;
}

.alphabet {

    display: grid;

    grid-template-columns:
        repeat(13, 1fr);

    gap: 5px;

    max-width: 650px;

    margin: 20px auto;
}

.letter {

    aspect-ratio: 1;

    display: flex;

    justify-content: center;
    align-items: center;

    background:
        var(--surface-light);

    border:
        1px solid
        var(--border);

    border-radius: 7px;

    font-family: monospace;

    font-size: 14px;

    transition:
        background 0.25s,
        transform 0.25s,
        border 0.25s;
}

.letter.source {

    background: #78350f;

    border-color: #f59e0b;

    transform: scale(1.12);
}

.letter.travel {

    background:
        var(--primary);

    border-color:
        var(--primary-light);

    transform:
        scale(1.14);
}

.letter.destination {

    background: #065f46;

    border-color:
        var(--success);

    transform:
        scale(1.15);
}

.progress-container {

    max-width: 600px;

    margin: 15px auto;
}

.progress {

    height: 7px;

    overflow: hidden;

    background:
        var(--surface-light);

    border-radius: 999px;
}

.progress-bar {

    width: 0%;

    height: 100%;

    background:
        var(--primary);

    transition:
        width 0.3s;
}

.result {

    max-width: 600px;

    min-height: 60px;

    margin: 20px auto 0;

    padding: 15px;

    background:
        var(--surface);

    border:
        1px solid
        var(--border);

    border-radius: 10px;

    font-family: monospace;

    font-size: 25px;

    letter-spacing: 4px;
}

@media (
    max-width: 550px
) {

    body {
        padding: 15px;
    }

    .controls {
        grid-template-columns:
            1fr;
    }

    .alphabet {

        grid-template-columns:
            repeat(7, 1fr);
    }
}

</style>

</head>

<body>

<h2>
Caesar Cipher Visualizer
</h2>

<p class="description">

Each letter moves the same number
of positions through the alphabet.

Watch the visualizer process the
message one character at a time.

</p>

<div class="controls">

    <div>

        <label for="text">
            MESSAGE
        </label>

        <input
            id="text"
            value="HELLO"
            maxlength="20"
        >

    </div>

    <div>

        <label for="shift">
            SHIFT
        </label>

        <input
            id="shift"
            type="number"
            value="3"
            min="-25"
            max="25"
        >

    </div>

</div>

<button id="visualize-button">
    Start Visualization
</button>

<div class="current-step">

    <div class="step-label">
        Current transformation
    </div>

    <div
        id="step-main"
        class="step-main">
        READY
    </div>

    <div
        id="step-explanation"
        class="step-explanation">

        Enter a message and press Start.

    </div>

</div>

<div
    id="alphabet"
    class="alphabet">
</div>

<div class="progress-container">

    <div class="progress">

        <div
            id="progress-bar"
            class="progress-bar">
        </div>

    </div>

</div>

<div
    id="result"
    class="result">
    ---
</div>

<script>

const alphabet =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

const LETTER_TIME =
    2500;

const STEP_TIME =
    350;

const alphabetElement =
    document.getElementById(
        "alphabet"
    );

const resultElement =
    document.getElementById(
        "result"
    );

const stepMain =
    document.getElementById(
        "step-main"
    );

const explanation =
    document.getElementById(
        "step-explanation"
    );

const progressBar =
    document.getElementById(
        "progress-bar"
    );

const button =
    document.getElementById(
        "visualize-button"
    );

const textInput =
    document.getElementById(
        "text"
    );


/*
Create alphabet display.
*/

for (
    const character
    of alphabet
) {

    const element =
        document.createElement(
            "div"
        );

    element.className =
        "letter";

    element.textContent =
        character;

    alphabetElement.appendChild(
        element
    );
}


textInput.addEventListener(
    "input",
    () => {

        textInput.value =
            textInput.value
            .toUpperCase();

    }
);


function sleep(milliseconds) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                milliseconds
            )
    );
}


function resetLetters() {

    document
        .querySelectorAll(
            ".letter"
        )
        .forEach(
            letter => {

                letter.classList.remove(
                    "source",
                    "travel",
                    "destination"
                );

            }
        );
}


async function animateCharacter(
    character,
    shift
) {

    const originalIndex =
        alphabet.indexOf(
            character
        );


    /*
    Spaces and punctuation stay unchanged.
    */

    if (
        originalIndex === -1
    ) {

        stepMain.textContent =
            character === " "
                ? "SPACE"
                : character;


        explanation.textContent =
            "Non-letter characters are not shifted.";


        await sleep(
            LETTER_TIME
        );


        return character;
    }


    /*
    Keep the ORIGINAL SIGN.

    +3 moves right.
    -3 moves left.

    The number input already limits the
    user between -25 and +25.
    */

    let signedShift =
        Math.trunc(
            Number(shift)
        );


    if (
        signedShift > 25
    ) {

        signedShift = 25;
    }


    if (
        signedShift < -25
    ) {

        signedShift = -25;
    }


    const direction =
        signedShift >= 0
            ? 1
            : -1;


    const numberOfSteps =
        Math.abs(
            signedShift
        );


    /*
    Calculate destination correctly
    even for negative numbers.
    */

    const destinationIndex =
        (
            (
                originalIndex
                + signedShift
            ) % 26
            + 26
        ) % 26;


    const destination =
        alphabet[
            destinationIndex
        ];


    const letterElements =
        document.querySelectorAll(
            ".letter"
        );


    resetLetters();


    /*
    Highlight starting letter.
    */

    letterElements[
        originalIndex
    ].classList.add(
        "source"
    );


    stepMain.textContent =
        `${character} → ?`;


    explanation.textContent =
        `${character} starts at alphabet position ${originalIndex}.`;


    await sleep(
        500
    );


    /*
    No shift.
    */

    if (
        numberOfSteps === 0
    ) {

        await sleep(
            900
        );

    } else {

        /*
        Fit movement within roughly
        2.5 seconds per character.
        */

        const availableTime =
            LETTER_TIME - 1100;


        const individualDelay =
            Math.max(
                120,
                Math.min(
                    STEP_TIME,
                    availableTime /
                    numberOfSteps
                )
            );


        /*
        Move either LEFT or RIGHT
        based on the shift sign.
        */

        for (
            let step = 1;
            step <= numberOfSteps;
            step++
        ) {

            resetLetters();


            const position =
                (
                    (
                        originalIndex
                        + (
                            step
                            * direction
                        )
                    ) % 26
                    + 26
                ) % 26;


            letterElements[
                position
            ].classList.add(
                "travel"
            );


            stepMain.textContent =
                `${character} → ${alphabet[position]}`;


            const directionWord =
                direction === 1
                    ? "forward"
                    : "backward";


            explanation.textContent =
                `Move ${step} of ${numberOfSteps} ${directionWord}.`;


            await sleep(
                individualDelay
            );
        }
    }


    /*
    Show final destination.
    */

    resetLetters();


    letterElements[
        destinationIndex
    ].classList.add(
        "destination"
    );


    const shiftLabel =
        signedShift >= 0
            ? `+${signedShift}`
            : `${signedShift}`;


    stepMain.textContent =
        `${character} → ${destination}`;


    explanation.textContent =
        `Shift ${shiftLabel}: ${character} becomes ${destination}.`;


    await sleep(
        600
    );


    resetLetters();


    return destination;
} 

{

    const originalIndex =
        alphabet.indexOf(
            character
        );

    /*
    Ignore spaces and punctuation.
    */

    if (
        originalIndex === -1
    ) {

        stepMain.textContent =
            character === " "
                ? "SPACE"
                : character;

        explanation.textContent =
            "Non-letter characters are not shifted.";

        await sleep(
            LETTER_TIME
        );

        return character;
    }


    const normalizedShift =
        (
            (shift % 26)
            + 26
        ) % 26;


    const destinationIndex =
        (
            originalIndex
            + normalizedShift
        ) % 26;


    const destination =
        alphabet[
            destinationIndex
        ];


    const letterElements =
        document.querySelectorAll(
            ".letter"
        );


    resetLetters();


    /*
    Highlight source.
    */

    letterElements[
        originalIndex
    ].classList.add(
        "source"
    );


    stepMain.textContent =
        `${character} → ?`;


    explanation.textContent =
        `${character} starts at alphabet position ${originalIndex}.`;


    await sleep(
        500
    );


    /*
    Animate individual movements.
    */

    if (
        normalizedShift === 0
    ) {

        await sleep(
            900
        );

    } else {

        const availableTime =
            LETTER_TIME - 1100;

        const individualDelay =
            Math.max(
                120,
                Math.min(
                    STEP_TIME,
                    availableTime /
                    normalizedShift
                )
            );


        for (
            let step = 1;
            step <= normalizedShift;
            step++
        ) {

            resetLetters();


            const position =
                (
                    originalIndex
                    + step
                ) % 26;


            letterElements[
                position
            ].classList.add(
                "travel"
            );


            stepMain.textContent =
                `${character} → ${alphabet[position]}`;


            explanation.textContent =
                `Move ${step} of ${normalizedShift}`;


            await sleep(
                individualDelay
            );
        }
    }


    resetLetters();


    letterElements[
        destinationIndex
    ].classList.add(
        "destination"
    );


    stepMain.textContent =
        `${character} → ${destination}`;


    explanation.textContent =
        `Shift +${normalizedShift}: ${character} becomes ${destination}.`;


    await sleep(
        600
    );


    resetLetters();


    return destination;
}


async function visualize() {

    const text =
        textInput.value
        .toUpperCase();


    const shift =
        Number(
            document.getElementById(
                "shift"
            ).value
        );


    if (
        !text.trim()
    ) {

        explanation.textContent =
            "Enter a message first.";

        return;
    }


    button.disabled =
        true;


    button.textContent =
        "Visualizing…";


    resultElement.textContent =
        "";


    progressBar.style.width =
        "0%";


    let result =
        "";


    for (
        let index = 0;
        index < text.length;
        index++
    ) {

        const character =
            text[index];


        const encrypted =
            await animateCharacter(
                character,
                shift
            );


        result += encrypted;


        resultElement.textContent =
            result;


        const percentage =
            (
                (index + 1)
                / text.length
            ) * 100;


        progressBar.style.width =
            `${percentage}%`;
    }


    stepMain.textContent =
        "COMPLETE";


    explanation.textContent =
        `Encrypted result: ${result}`;


    button.disabled =
        false;


    button.textContent =
        "Start Visualization";
}


button.addEventListener(
    "click",
    visualize
);

</script>

</body>

</html>
